<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MobileMem-Omni</title>
    <meta
      name="description"
      content="MobileMem and MobileMem-Omni benchmark results across memory methods."
    />
    <link rel="stylesheet" href="assets/web/css/site.css?v=20260817-5" />
    <link rel="stylesheet" href="assets/web/css/leaderboard.css?v=20260817-2" />
  </head>
  <body class="lang-en leaderboard-page">
    <a class="skip-link" href="#leaderboard-main">Skip to results</a>
    <header class="leaderboard-topbar" aria-label="Leaderboard navigation">
      <div class="leaderboard-topbar-inner">
        <a
          class="leaderboard-back"
          href="index.html#mobilemem"
          aria-label="返回 MobileMem 首页 / Back to MobileMem"
        >
          <span class="leaderboard-back-icon" aria-hidden="true">&larr;</span>
          <span data-lang="zh">返回</span>
          <span data-lang="en">Back</span>
        </a>
        <strong class="leaderboard-context" data-leaderboard-context>MobileMem-Omni</strong>
        <div class="language-toggle" role="group" aria-label="Language">
          <button type="button" data-toggle-lang="zh" aria-label="Switch language to Chinese">
            Chinese
          </button>
        </div>
      </div>
    </header>

    <main id="leaderboard-main" class="leaderboard-main">
      <section class="leaderboard-hero" aria-labelledby="leaderboard-title">
        <div class="wrap leaderboard-hero-row">
          <div class="leaderboard-title-row">
            <h1 id="leaderboard-title" data-leaderboard-title>MobileMem-Omni</h1>
            <details class="benchmark-title-switcher" data-benchmark-switcher>
              <summary aria-label="Switch benchmark" title="Switch benchmark">
                <span class="benchmark-title-chevron" aria-hidden="true"></span>
              </summary>
              <div class="benchmark-title-menu" aria-label="Benchmark">
                <button type="button" data-benchmark="omni" aria-current="true">
                  MobileMem-Omni
                </button>
                <button type="button" data-benchmark="textual" aria-current="false">
                  MobileMem-Text
                </button>
              </div>
            </details>
          </div>
          <p class="leaderboard-submit-note">
            <span data-lang="zh">欢迎提交结果上榜，请联系</span>
            <span data-lang="en">To submit results to the leaderboard, contact</span>
            <a href="mailto:zhangningyu@zju.edu.cn">zhangningyu@zju.edu.cn</a>
          </p>
        </div>
      </section>

      <section class="leaderboard-controls" aria-label="Leaderboard filters">
        <div class="wrap leaderboard-control-row">
          <div class="control-group">
            <span class="control-label">
              <span data-lang="zh">模型骨干</span>
              <span data-lang="en">Backbone</span>
            </span>
            <div class="segmented-control" data-backbone-control>
              <button type="button" data-backbone="gpt" aria-pressed="true">GPT-5.4-mini</button>
              <button type="button" data-backbone="qwen" aria-pressed="false">
                Qwen3-VL-8B-Instruct
              </button>
            </div>
          </div>

          <div class="control-group" data-family-control-group>
            <span class="control-label">
              <span data-lang="zh">方法类型</span>
              <span data-lang="en">Method family</span>
            </span>
            <div class="segmented-control" data-family-control>
              <button type="button" data-family="all" aria-pressed="true">
                <span data-lang="zh">全部</span>
                <span data-lang="en">All</span>
              </button>
              <button type="button" data-family="textual" aria-pressed="false">
                <span data-lang="zh">文本</span>
                <span data-lang="en">Textual</span>
              </button>
              <button type="button" data-family="multimodal" aria-pressed="false">
                <span data-lang="zh">多模态</span>
                <span data-lang="en">Multimodal</span>
              </button>
            </div>
          </div>

          <div class="control-group resource-control">
            <span class="control-label">
              <span data-lang="zh">项目链接</span>
              <span data-lang="en">Resources</span>
            </span>
            <nav class="leaderboard-resource-links" aria-label="Project resources">
              <a
                href="https://github.com/zjunlp/MobileMem/"
                target="_blank"
                rel="noopener noreferrer"
              >
                GitHub
              </a>
              <a
                href="https://huggingface.co/datasets/zjunlp/MobileMem"
                target="_blank"
                rel="noopener noreferrer"
              >
                Hugging Face
              </a>
            </nav>
          </div>

          <label class="control-group rank-control" for="rank-metric">
            <span class="control-label">
              <span data-lang="zh">排序指标</span>
              <span data-lang="en">Rank metric</span>
            </span>
            <select id="rank-metric" data-rank-metric></select>
          </label>
        </div>
      </section>

      <section class="leaderboard-results">
        <div class="wrap">
          <p class="visually-hidden" data-leaderboard-state aria-live="polite"></p>

          <div
            class="leaderboard-table-shell"
            tabindex="0"
            aria-label="Results table; scroll horizontally on narrow screens"
          >
            <table class="leaderboard-table">
              <caption class="visually-hidden" data-leaderboard-caption></caption>
              <thead data-leaderboard-head></thead>
              <tbody data-leaderboard-body></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/web/js/main.js?v=20260817-7"></script>
    <script src="assets/web/js/leaderboard.js?v=20260817-1"></script>
  </body>
</html>
