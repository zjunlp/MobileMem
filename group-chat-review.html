<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MobileMem 用户头像挑选</title>
    <link rel="stylesheet" href="assets/web/css/group-chat-review.css" />
  </head>
  <body>
    <header class="review-header">
      <div>
        <p class="review-kicker">MobileMem · PORTRAIT REVIEW</p>
        <h1>用户头像挑选</h1>
        <p class="review-intro">
          主角固定在每组左侧；右侧展示同一 UID 下其余全部人物参考与群成员头像。
        </p>
      </div>
      <p class="review-rule">只比较同一 UID</p>
    </header>

    <main id="review-content" class="review-content"></main>

    <aside class="selection-bar" aria-live="polite">
      <span><strong id="selection-count">0</strong> 张已选</span>
      <button id="copy-selection" type="button">复制编号</button>
      <button id="clear-selection" class="is-quiet" type="button">清空</button>
    </aside>

    <script src="assets/web/js/application-data.js"></script>
    <script src="assets/web/js/group-chat-review.js"></script>
  </body>
</html>
